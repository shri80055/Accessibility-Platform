# Nginx — Accessibility Platform (adapt server_name + cert paths)
# Upstream: Node API on 127.0.0.1:3000 (see docs/deployment/linux-nginx.md)
server {
    listen 443 ssl http2;
    server_name accessibility.example.gov.in;
    ssl_certificate /etc/letsencrypt/live/accessibility.example.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accessibility.example.gov.in/privkey.pem;
    gzip on; gzip_types text/css application/javascript application/json text/html;
    location /widget/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Preserve the API's immutable cache headers. Do NOT add no-store here.
    }
    location /api/public/config {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_no_cache 1; proxy_cache_bypass 1; # never cache published config
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server { listen 80; server_name accessibility.example.gov.in; return 301 https://$host$request_uri; }
